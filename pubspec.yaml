name: ez_workforce
description: EZ Workforce - Complete HR and Workforce Management Platform (Android, iOS, Web).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.8.0

  # State management and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # UI
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2

  # Utilities
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
