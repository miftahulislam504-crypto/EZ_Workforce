name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        id: loc
        run: |
          P=$(dirname "$(find . -name pubspec.yaml -not -path './.git/*' | sort | head -1)")
          echo "Project dir: $P"
          echo "dir=$P" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - name: Build
        working-directory: ${{ steps.loc.outputs.dir }}
        run: |
          flutter create . --platforms=android --project-name ez_workforce --org com.ezworkforce
          rm -f test/widget_test.dart
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ez-workforce-apk
          path: ${{ steps.loc.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
